apiVersion: apps/v1
kind: Deployment
metadata:
  name: mana-food-payment
  namespace: default
  labels:
    app: mana-food-payment
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mana-food-payment
  template:
    metadata:
      labels:
        app: mana-food-payment
        version: v1
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mana-food-payment
        image: ghcr.io/mana-food/mana-food-microsservico-pagamento:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: mana-food-payment-config
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 5
          failureThreshold: 30
